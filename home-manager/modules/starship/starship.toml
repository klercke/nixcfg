"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 100
command_timeout = 500

follow_symlinks = false
add_newline = true

format = """$all$fill$time
$username$hostname($shell) $directory $character"""

[shell]
disabled = false
format = '[\($indicator\)]($style)'
style = "cyan"

[fill]
disabled = false
symbol = "."

[directory]
style = "sapphire"
format = "[$path]($style)"
truncation_length = 4
read_only = " 󰌾"

[username]
disabled = false
show_always = false
style_user = "fg:green"
style_root = "fg:bright-red"
format = "[$user]($style)"

[hostname]
ssh_symbol = ""
disabled = false
format = "[@$hostname$ssh_symbol]($style)"
style = "fg:blue"
ssh_only = true

[line_break]
disabled = true

[character]
disabled = false
success_symbol = "[❯](bold fg:green)"
error_symbol = "[✗](bold fg:red)"
vimcmd_symbol = "[:](bold fg:yellow)"

[time]
disabled = false
#time_format = "%T%z"
time_format = "%T"
format = '\[[ $time]($style)\]'

[git_status]
disabled = false
format = '(\[[$all_status$ahead_behind]($style)\])'
staged     = "[+${count}](green)"
modified   = "[!${count}](yellow)"
renamed    = "[»${count}](blue)"
deleted    = "[-${count}](red)"
untracked  = "[?${count}](bright-blue)"
stashed    = "[≡${count}](magenta)"
conflicted = "[✗${count}](bright-red bold)"

ahead      = "[⇡${count}](bright-cyan)"
behind     = "[⇣${count}](bright-magenta)"
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}](bright-yellow)"

[direnv]
disabled = true
format = '\[[$symbol$allowed]($style)\]'

# Nerdfont symbols + bracketed segments

